<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="budgie-pwa" content="1"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="color-scheme" content="dark"><meta name="description" content="Budgie zeigt dir jeden Tag, wie viel Geld du heute noch ausgeben kannst."><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="favicon-64.png"><title>Budgie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#141215">
<meta name="apple-mobile-web-app-title" content="Budgie">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
</head><body style="margin:0;background:#121113"><style>
/* Design v2 'Wellensittich': night-blue base, the hero card wears budgie plumage (yellow face to green body) with wave barring, violet cheek for links, yolk yellow for rewards. Layout: one-column phone app (max 460px); glass cards; hero is a tiltable card holding "liquid" that drains as you spend; glass tab bar with sliding pill + glowing add button. Deliberately single-theme (dark). */
:root{
  color-scheme:dark;
  --bg:#121113; --bg-2:#161517; --row:#1B191C;
  --ink:#F3EFE7; --ink-2:rgba(243,239,231,.9); --ink-3:rgba(243,239,231,.78); --ink-4:rgba(243,239,231,.68);
  --glass:rgba(255,255,255,.045); --glass-2:rgba(255,255,255,.075); --stroke:rgba(255,255,255,.08); --stroke-2:rgba(255,255,255,.15);
  --mint:#D6C29A; --mint-2:#B79F72; --mint-glow:rgba(214,194,154,.45); --emerald:#2E2A24; --gold:#E6CF9C;
  --ok:#8FCB9B; --warn:#E5B567; --bad:#E5806F;
  --accent:var(--mint); --accent-ink:#141215;
  --c-essen:#E2B979; --c-feiern:#E58F8F; --c-gaming:#9C9AE8; --c-shopping:#7DB3DE; --c-fahrt:#6FC2B2; --c-einmalig:#ABA69E; --c-einkauf:#9FBF8C; --c-puffer:#D49AC9; --c-sonst:#B8B1A7; --c-geschenkt:#D6C29A; --c-job:#A9C3C9; --c-zurueck:#E6D8B6; --c-extra:#E6CF9C; --c-sweep:#E6CF9C;
  --display:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Inter','Segoe UI',Roboto,system-ui,sans-serif;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Inter','Segoe UI',Roboto,system-ui,sans-serif;
  --mono:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Inter','Segoe UI',Roboto,system-ui,sans-serif;
  --r-xl:30px; --r-lg:24px; --r-md:18px; --r-sm:13px;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1); --sheet:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:35;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px;border-radius:10px}
.press{transition:transform .3s var(--spring),background-color .2s,opacity .2s,border-color .2s,box-shadow .3s}
.press:active{transform:scale(.95)}

/* aurora */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(120% 70% at 50% -10%,#2A2620 0%,var(--bg) 60%)}
.aurora i{position:absolute;border-radius:50%;opacity:.55;will-change:transform}
.aurora .a1{width:80vmax;height:80vmax;left:-30vmax;top:-34vmax;background:radial-gradient(closest-side,rgba(191,168,120,.42),transparent 70%);animation:au1 22s ease-in-out infinite alternate}
.aurora .a2{width:70vmax;height:70vmax;right:-34vmax;top:6vmax;background:radial-gradient(closest-side,rgba(214,194,154,.26),transparent 70%);animation:au2 26s ease-in-out infinite alternate}
.aurora .a3{width:60vmax;height:60vmax;left:-10vmax;bottom:-36vmax;background:radial-gradient(closest-side,rgba(230,207,156,.13),transparent 70%);animation:au3 30s ease-in-out infinite alternate}
.aurora::after{content:"";position:absolute;inset:0;opacity:.09;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@keyframes au1{to{transform:translate3d(18vmax,10vmax,0) scale(1.15)}}
@keyframes au2{to{transform:translate3d(-14vmax,16vmax,0) scale(.9)}}
@keyframes au3{to{transform:translate3d(20vmax,-12vmax,0) scale(1.2)}}

#root{position:relative;z-index:1}
.app{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(124px + env(safe-area-inset-bottom,0px))}

/* compact bar on scroll */
.cbar{position:fixed;left:0;right:0;top:0;z-index:34;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:rgba(27,23,18,.62);backdrop-filter:saturate(1.6) blur(22px);-webkit-backdrop-filter:saturate(1.6) blur(22px);border-bottom:1px solid var(--stroke);opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .3s,transform .4s var(--ease)}
.cbar.on{opacity:1;transform:none}
.cbar div{height:50px;display:grid;place-items:center;font-weight:650;font-size:15.5px;letter-spacing:-.01em}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 2px 18px}
.top .hi{font-size:12px;color:var(--ink-3);font-weight:550;margin:0 0 5px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}
.top h1{margin:0;font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:-.03em;line-height:1.15;text-wrap:balance}
.avatar{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(140deg,rgba(214,194,154,.22),rgba(214,194,154,.06));border:1px solid var(--stroke-2);color:var(--mint);font-family:var(--display);font-weight:600;font-size:16px;position:relative;flex:none}
.avatar i{position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;border:2.5px solid var(--bg);background:var(--ok);box-shadow:0 0 10px var(--mint-glow)}
.avatar i.local{background:var(--warn);box-shadow:0 0 10px rgba(229,181,103,.5)}
.page-title{margin:8px 2px 20px;font-family:var(--display);font-size:30px;font-weight:600;letter-spacing:-.035em}

/* glass */
.stack{display:grid;gap:14px}
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid var(--stroke);border-radius:var(--r-lg);padding:18px;min-width:0;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(160deg,rgba(255,255,255,.16),transparent 40%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h2{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em}
.card-h a,.link{color:var(--mint);font-size:13px;font-weight:600;cursor:pointer}
.label{font-family:var(--font);font-size:12.5px;font-weight:600;letter-spacing:.01em;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.small{font-size:13px}

/* odometer */
.odo{display:inline-flex;align-items:baseline;line-height:1;white-space:nowrap}
.odo .d{display:inline-block;height:1em;overflow:hidden;vertical-align:top}
.odo .col{display:flex;flex-direction:column;transition:transform 1.1s cubic-bezier(.16,1,.3,1)}
.odo .col span,.odo .s{display:block;height:1em;line-height:1}
.odo .s{display:inline-block}
.odo small{display:inline-flex;align-items:baseline;font-size:.46em;margin-left:.06em;opacity:.72}

/* hero card */
.tilt{perspective:900px}
.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:20px 20px 18px;color:#F3EFE7;min-height:228px;display:flex;flex-direction:column;
  background:linear-gradient(145deg,#2A2620 0%,#2E2A24 48%,#4A4236 100%);
  box-shadow:0 30px 60px -28px rgba(191,168,120,.55),0 0 0 1px rgba(255,255,255,.1) inset;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;transition:transform .7s var(--spring);isolation:isolate;touch-action:pan-y}
.hero.drag{transition:transform .08s linear}
.hero .holo{position:absolute;inset:-60%;z-index:-1;filter:blur(18px);background:conic-gradient(from 0deg,transparent 0 20%,rgba(214,194,154,.16) 30%,rgba(230,207,156,.12) 38%,rgba(214,194,154,.1) 46%,transparent 56% 100%);animation:spin 14s linear infinite;mix-blend-mode:screen}
.hero .glare{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(260px circle at var(--mx,85%) var(--my,-10%),rgba(255,255,255,.18),transparent 60%);mix-blend-mode:overlay}
.hero .grain{position:absolute;inset:0;z-index:-1;opacity:.18;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@keyframes spin{to{transform:rotate(360deg)}}
.liquid{position:absolute;left:0;right:0;bottom:0;z-index:-1;height:0;transition:height 1.6s var(--ease)}
.liquid .fill{position:absolute;inset:0;background:linear-gradient(to top,rgba(214,194,154,.26),rgba(214,194,154,.07))}
.liquid svg{position:absolute;left:0;width:200%;height:18px;bottom:100%;margin-bottom:-1px}
.liquid .w1{animation:wave 7s linear infinite;fill:rgba(214,194,154,.09)}
.liquid .w2{animation:wave 11s linear infinite reverse;fill:rgba(214,194,154,.06);bottom:calc(100% + 3px)}
.liquid.warn .fill{background:linear-gradient(to top,rgba(229,181,103,.34),rgba(229,181,103,.12))}.liquid.warn .w1{fill:rgba(229,181,103,.12)}.liquid.warn .w2{fill:rgba(229,181,103,.08)}
.liquid.bad .fill{background:linear-gradient(to top,rgba(229,128,111,.34),rgba(229,128,111,.12))}.liquid.bad .w1{fill:rgba(229,128,111,.12)}.liquid.bad .w2{fill:rgba(229,128,111,.08)}
@keyframes wave{to{transform:translateX(-50%)}}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;transform:translateZ(30px)}
.brand{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:-.01em}
.brand b{width:22px;height:16px;border-radius:4px;background:linear-gradient(135deg,#F0E4C8,#B8975C);position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.brand b::before{content:"";position:absolute;inset:4px 3px;border:1px solid rgba(0,0,0,.25);border-radius:2px}
.hero .label{color:rgba(243,239,231,.62);margin-top:22px;transform:translateZ(20px)}
.big{font-family:var(--display);font-size:50px;font-weight:600;letter-spacing:-.04em;margin:10px 0 10px;transform:translateZ(40px);filter:drop-shadow(0 8px 20px rgba(0,0,0,.25))}
.hero-sub{color:rgba(243,239,231,.7);font-size:13.5px;font-weight:500;transform:translateZ(20px)}
.hero-sub b{color:#fff;font-weight:650}
.hero-foot{margin-top:auto;padding-top:16px;display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:rgba(243,239,231,.78);text-transform:uppercase;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:99px;font-size:12px;font-weight:650;white-space:nowrap;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.pill.warn::before,.pill.bad::before{animation:blink 2s ease-in-out infinite}
.pill.ok{color:#C8F5A8}.pill.warn{color:#E8D3A8}.pill.bad{color:#E39A8C}
@keyframes blink{50%{opacity:.35}}

/* bars */
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.07);position:relative;overflow:visible}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;width:0;background:linear-gradient(90deg,var(--mint-2),var(--mint));box-shadow:0 0 16px -2px var(--mint-glow);transition:width 1.3s var(--ease);overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-100%);animation:shim 1.8s ease-in-out 1 1.3s}
.bar i.warn{background:linear-gradient(90deg,#A9824A,var(--warn));box-shadow:0 0 16px -2px rgba(229,181,103,.5)}
.bar i.bad{background:linear-gradient(90deg,#B5584A,var(--bad));box-shadow:0 0 16px -2px rgba(229,128,111,.5)}
.bar i.gold{background:linear-gradient(90deg,#B8975C,var(--gold));box-shadow:0 0 16px -2px rgba(230,207,156,.5)}
@keyframes shim{60%,100%{transform:translateX(100%)}}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.kv .v{font-family:var(--display);font-size:26px;font-weight:600;letter-spacing:-.035em}
.metric-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:rgba(255,255,255,.04);border:1px solid var(--stroke);border-radius:var(--r-md);padding:12px 14px;min-width:0}
.metric .v{display:block;font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:-.03em;margin-top:6px;white-space:nowrap;overflow:hidden}

/* week chart */
.wchart{width:100%;height:auto;display:block;overflow:visible}
.wchart text{font-family:var(--mono);font-size:12px;fill:var(--ink-3)}
.wchart text.today{fill:var(--ink);font-weight:600}
.wchart text.val{fill:var(--mint);font-weight:600}
.wchart .tline{stroke:var(--ink-4);stroke-dasharray:3 4;stroke-width:1}
.wchart rect.b{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.1s var(--spring) both;animation-delay:calc(var(--i)*70ms + 150ms)}
.wchart rect.past{fill:url(#gPast)}
.wchart rect.today{fill:url(#gToday);filter:drop-shadow(0 0 10px rgba(214,194,154,.55))}
.wchart rect.over{fill:url(#gOver);filter:drop-shadow(0 0 10px rgba(229,181,103,.4))}
.wchart rect.future{fill:rgba(255,255,255,.035);stroke:rgba(255,255,255,.08);stroke-dasharray:3 3}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}

/* transactions */
.txs{display:grid;gap:8px}
.tx{position:relative;border-radius:var(--r-md);overflow:hidden;transition:height .35s var(--ease),opacity .3s,margin .35s}
.tx.gone{opacity:0;height:0!important;margin-top:-8px}
.tx-del{position:absolute;inset:0 0 0 auto;width:110px;display:flex;align-items:center;justify-content:flex-end;gap:6px;padding-right:18px;background:linear-gradient(90deg,transparent,rgba(229,128,111,.25) 30%,rgba(229,128,111,.9));color:#fff;font-weight:650;font-size:13px}
.tx-del svg{width:18px;height:18px}
.tx-del{opacity:0;transition:opacity .2s}.tx.open .tx-del,.tx.sw .tx-del{opacity:1}
.tx-fg{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:11px 14px 11px 11px;background:var(--row);border:1px solid var(--stroke);border-radius:var(--r-md);transition:transform .5s var(--spring);touch-action:pan-y;cursor:pointer;user-select:none}
.tx.open .tx-fg{transform:translateX(-96px)}
.tx-ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 28%,transparent)}
.tx-ic svg{width:20px;height:20px}
.tx-main{min-width:0}
.tx-main b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-main small{display:block;color:var(--ink-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-amt{font-weight:650;font-size:15px;white-space:nowrap}
.enter .txs .tx,.slide-r .txs .tx,.slide-l .txs .tx{animation:rise .6s var(--ease) both;animation-delay:calc(var(--j,0)*45ms + 220ms)}
.day-h{display:flex;justify-content:space-between;padding:16px 4px 8px;font-size:12px;font-weight:600;color:var(--ink-3);font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase}
.empty{text-align:center;padding:22px 10px 10px;color:var(--ink-3);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.swipe-hint{font-size:12px;color:var(--ink-4);text-align:center;margin-top:10px}

/* insight */
.insight{display:flex;gap:14px;align-items:flex-start}
.insight .ic{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(140deg,rgba(230,207,156,.3),rgba(230,207,156,.06));color:var(--gold);border:1px solid rgba(230,207,156,.25)}
.insight .ic svg{width:20px;height:20px}
.insight p{margin:0;font-size:14px;color:var(--ink-2)}
.insight p b{color:var(--ink)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.tabbar::before{content:"";position:absolute;inset:-30px 0 0;background:linear-gradient(to top,var(--bg) 30%,transparent);pointer-events:none}
.tabbar-in{position:relative;pointer-events:auto;max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:70px;border-radius:26px;background:rgba(22,20,23,.72);backdrop-filter:saturate(1.8) blur(24px);-webkit-backdrop-filter:saturate(1.8) blur(24px);border:1px solid var(--stroke-2);box-shadow:0 20px 40px -14px rgba(0,0,0,.7)}
.tpill{position:absolute;top:9px;left:0;height:52px;border-radius:18px;background:rgba(214,194,154,.1);border:1px solid rgba(214,194,154,.2);transition:transform .55s var(--spring),width .55s var(--spring),opacity .3s;pointer-events:none}
.tab{position:relative;display:grid;justify-items:center;gap:3px;color:var(--ink-3);font-size:12px;font-weight:600;padding:8px 0;transition:color .3s}
.tab svg{width:23px;height:23px;transition:transform .45s var(--spring)}
.tab.on{color:var(--mint)}
.tab.on svg{transform:translateY(-1px) scale(1.08);filter:drop-shadow(0 0 8px var(--mint-glow))}
.fab{position:relative;justify-self:center;width:60px;height:60px;border-radius:21px;display:grid;place-items:center;background:linear-gradient(140deg,#EADFC5,var(--mint) 40%,var(--mint-2));color:var(--accent-ink);box-shadow:0 12px 30px -8px var(--mint-glow),inset 0 1px 0 rgba(255,255,255,.5);transform:translateY(-16px);transition:transform .45s var(--spring)}
.fab::after{content:"";position:absolute;inset:-6px;border-radius:26px;border:1.5px solid var(--mint);opacity:0;animation:ring 3.2s ease-out 3 2s}
@keyframes ring{0%{opacity:.6;transform:scale(.9)}70%,100%{opacity:0;transform:scale(1.25)}}
.fab svg{width:28px;height:28px;transition:transform .45s var(--spring)}
.fab:active{transform:translateY(-16px) scale(.9)}
.fab.on svg{transform:rotate(135deg)}

/* page transitions */
.enter .rise{animation:rise .75s var(--ease) both;animation-delay:calc(var(--i,0)*65ms)}
.slide-r .rise{animation:slr .6s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
.slide-l .rise{animation:sll .6s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes slr{from{opacity:0;transform:translateX(36px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes sll{from{opacity:0;transform:translateX(-36px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .4s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:460px;margin:0 auto;background:linear-gradient(180deg,rgba(32,30,34,.96),rgba(18,17,19,.98));border:1px solid var(--stroke-2);border-bottom:0;border-radius:32px 32px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .55s var(--sheet);box-shadow:0 -20px 60px -10px rgba(0,0,0,.7);max-height:94vh;overflow-y:auto}

.grab{width:40px;height:5px;border-radius:9px;background:var(--stroke-2);margin:0 auto 10px}
.sheet-h{display:flex;justify-content:space-between;align-items:center}

.x{width:40px;height:40px;border-radius:12px;background:var(--glass-2);border:1px solid var(--stroke);display:grid;place-items:center;color:var(--ink-2)}
.x svg{width:18px;height:18px}
.amt{text-align:center;padding:6px 0 2px}
.amt-v{font-family:var(--display);font-size:46px;font-weight:600;letter-spacing:-.045em;line-height:1.1;white-space:nowrap;transition:transform .2s var(--ease),color .3s}

.amt-v.bump{animation:bump .25s var(--spring)}
.amt-v.shake{animation:shake .4s}

@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.amt-hint{font-size:13px;color:var(--ink-2);min-height:19px;transition:color .3s;line-height:1.4}
.amt-hint .sub{display:block;color:var(--gold);font-size:12.5px}
.amt-hint.over{color:var(--warn)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 10px;scrollbar-width:none;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:14px;background:var(--glass);border:1px solid var(--stroke);font-size:13.5px;font-weight:600;color:var(--ink-2);transition:all .35s var(--spring)}
.chip svg{width:17px;height:17px;color:var(--c,currentColor)}
.chip.on{background:color-mix(in srgb,var(--c,var(--mint)) 16%,transparent);border-color:color-mix(in srgb,var(--c,var(--mint)) 70%,transparent);color:var(--ink);box-shadow:0 0 18px -6px var(--c,var(--mint));transform:translateY(-1px)}
.row2{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-bottom:10px}
.field{width:100%;border:1px solid var(--stroke);background:rgba(255,255,255,.04);border-radius:14px;padding:12px 13px;font-size:15px;outline:none;transition:border-color .25s,box-shadow .25s,background .25s}
.field:focus{border-color:rgba(214,194,154,.6);box-shadow:0 0 0 4px rgba(214,194,154,.12);background:rgba(255,255,255,.06)}
.field::placeholder{color:var(--ink-4)}
select.field option{background:#1B191C;color:var(--ink)}
.datechips{display:flex;gap:6px}
.datechips .chip{padding:9px 11px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 0}
.key{height:48px;border-radius:17px;background:rgba(255,255,255,.05);border:1px solid var(--stroke);font-family:var(--display);font-size:21px;font-weight:500;display:grid;place-items:center;transition:background .15s,transform .2s var(--spring);user-select:none}

.key svg{width:24px;height:24px}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:58px;border-radius:19px;background:linear-gradient(140deg,#EADFC5,var(--mint) 45%,var(--mint-2));color:var(--accent-ink);font-weight:700;font-size:16px;box-shadow:0 14px 30px -12px var(--mint-glow),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .3s var(--spring),opacity .2s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:sweep 4s ease-in-out 2 .8s}
@keyframes sweep{40%,100%{transform:translateX(120%)}}
.btn svg{width:20px;height:20px;flex:none}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--glass-2);color:var(--ink);border:1px solid var(--stroke);box-shadow:none}
.btn.ghost::after{display:none}
.btn[disabled]{opacity:.35}
.btn[disabled]::after{display:none}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:50;transform:translate(-50%,24px) scale(.96);opacity:0;pointer-events:none;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);padding:11px 12px;border-radius:18px;background:rgba(36,34,38,.92);border:1px solid var(--stroke-2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:14px;font-weight:550;box-shadow:0 18px 40px -12px rgba(0,0,0,.7);transition:all .5s var(--spring)}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.toast button{color:var(--mint);font-weight:700;padding:4px 8px;border-radius:8px;white-space:nowrap}
.toast .ck{width:24px;height:24px;border-radius:9px;background:var(--mint);color:var(--accent-ink);display:grid;place-items:center;flex:none;box-shadow:0 0 12px var(--mint-glow)}
.toast .ck svg{width:14px;height:14px}

/* history */
.seg{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.seg button.nav{width:40px;height:40px;border-radius:13px;background:var(--glass-2);border:1px solid var(--stroke);display:grid;place-items:center;color:var(--ink-2)}
.seg button.nav svg{width:18px;height:18px}
.seg button.nav[disabled]{opacity:.3}
.seg .t{text-align:center}
.seg .t b{display:block;font-size:16px;font-weight:650}
.seg .t small{color:var(--ink-3);font-size:12px;font-family:var(--mono);letter-spacing:.04em}
.stackbar{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:3px;margin:16px 0}
.stackbar i{display:block;height:100%;border-radius:99px;background:var(--c);box-shadow:0 0 12px -2px var(--c);transform-origin:left;animation:sx 1s var(--ease) both}
@keyframes sx{from{transform:scaleX(0);opacity:0}}
.legend{display:grid;gap:10px}
.legend div{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;font-size:13.5px}
.legend i{width:10px;height:10px;border-radius:4px;background:var(--c);box-shadow:0 0 8px var(--c)}
.legend span.p{color:var(--ink-3);font-size:12px;width:40px;text-align:right}

/* forms */
.form{display:grid;gap:12px}
.fld{display:grid;gap:6px}
.fld>span{font-size:13px;font-weight:600;color:var(--ink-2)}
.money{position:relative}
.money .field{padding-right:34px}
.money::after{content:"€";position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px;gap:6px;align-items:center;padding:8px;border-radius:16px;background:rgba(255,255,255,.025);border:1px solid var(--stroke)}
.fx>input.field{grid-column:1/3;grid-row:1}.fx>.money{grid-column:1;grid-row:2}.fx>select{grid-column:2;grid-row:2}.fx>.x{grid-column:3;grid-row:1/3;justify-self:center}

.fx select.field{padding:11px 6px;font-size:13px}
.addrow{display:inline-flex;align-items:center;gap:6px;color:var(--mint);font-weight:650;font-size:14px;padding:6px 2px;justify-self:start}

.note{font-size:12.5px;color:var(--ink-3);margin:0}
.sum-live{display:grid;gap:9px}
.sum-live .ln{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2)}
.sum-live .ln b{color:var(--ink);font-weight:600}
.sum-live .ln.total{border-top:1px solid var(--stroke);padding-top:12px;margin-top:3px;font-size:15px;color:var(--ink)}
.sum-live .ln.total b{font-family:var(--display);font-size:20px;color:var(--mint);text-shadow:0 0 18px var(--mint-glow)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:9px;background:linear-gradient(90deg,var(--mint) var(--p,50%),rgba(255,255,255,.1) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;margin-top:-9px;background:#fff;box-shadow:0 0 0 5px rgba(214,194,154,.25),0 4px 10px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:6px;border-radius:9px;background:rgba(255,255,255,.1)}
input[type=range]::-moz-range-progress{height:6px;border-radius:9px;background:var(--mint)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(214,194,154,.25)}
.status{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--ink-2)}

.status i.local{background:var(--warn);box-shadow:0 0 8px rgba(229,181,103,.5)}
.danger{color:var(--bad);font-weight:600;font-size:14px}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.confirm .btn{height:44px;width:auto;padding:0 16px;font-size:14px}
.confirm .btn.red{background:var(--bad);color:#fff;box-shadow:none}
.confirm .btn.red::after{display:none}

/* goal */
.gchart{width:100%;height:auto;display:block;overflow:visible}
.gchart text{font-family:var(--mono);font-size:12px;fill:var(--ink-3)}
.gchart .grid{stroke:rgba(255,255,255,.06);stroke-width:1}
.gchart .paid{stroke:rgba(255,255,255,.35);stroke-dasharray:3 4;fill:none;stroke-width:1.3}
.gchart .alt{stroke:rgba(255,255,255,.28);fill:none;stroke-width:1.2}

.gchart text.tl{fill:var(--gold);font-weight:600}
.gchart circle.end{fill:var(--mint);stroke:var(--bg);stroke-width:3}
.gchart circle.pulse{fill:none;stroke:var(--mint);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.2);opacity:0}}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);padding:4px;border-radius:15px}
.seg3 button{display:grid;gap:1px;padding:8px 0;border-radius:11px;font-size:13.5px;font-weight:650;color:var(--ink-3);transition:all .35s var(--spring)}
.seg3 button small{font-size:12px;font-weight:550;opacity:.8}
.seg3 button.on{background:rgba(214,194,154,.14);color:var(--mint);box-shadow:inset 0 0 0 1px rgba(214,194,154,.3)}
.goal-big{font-family:var(--display);font-size:38px;font-weight:600;letter-spacing:-.04em;line-height:1.05;margin:8px 0 6px;color:#fff;filter:drop-shadow(0 0 16px rgba(214,194,154,.35))}
.legend-g{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-3);margin-top:8px}
.legend-g span{display:inline-flex;align-items:center;gap:6px}
.legend-g i{width:14px;height:0;border-top:2.5px solid var(--mint)}
.legend-g i.d{border-top:1.5px dashed rgba(255,255,255,.4)}
.legend-g i.a{border-top:1.5px solid rgba(255,255,255,.3)}
.legend-g i.t{border-top:1.5px dashed var(--gold)}
.tip{display:flex;gap:10px;padding:12px 14px;border-radius:15px;background:rgba(214,194,154,.07);border:1px solid rgba(214,194,154,.18);color:var(--ink-2);font-size:13.5px;margin-top:16px}
.tip svg{width:18px;height:18px;flex:none;color:var(--mint);margin-top:1px}
.tip b{color:var(--ink)}

/* onboarding */
.ob{position:fixed;inset:0;z-index:60;overflow-y:auto;display:flex;flex-direction:column}
.ob-in{flex:1;width:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
.ob-top{display:flex;align-items:center;gap:12px;height:44px}
.ob-prog{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.ob-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--mint-2),var(--mint));border-radius:9px;box-shadow:0 0 12px var(--mint-glow);transition:width .7s var(--ease)}
.ob-body{flex:1;padding:26px 0 18px;display:flex;flex-direction:column}
.ob-body.go>*{animation:obIn .6s var(--ease) both}
.ob-body.back>*{animation:obBack .6s var(--ease) both}
.ob-body>*:nth-child(2){animation-delay:.05s}.ob-body>*:nth-child(3){animation-delay:.1s}.ob-body>*:nth-child(4){animation-delay:.15s}.ob-body>*:nth-child(5){animation-delay:.2s}
@keyframes obIn{from{opacity:0;transform:translateX(34px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes obBack{from{opacity:0;transform:translateX(-34px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.ob h2{font-family:var(--display);font-size:28px;line-height:1.12;letter-spacing:-.035em;font-weight:600;margin:0 0 12px;text-wrap:balance}
.ob .lead{color:var(--ink-2);font-size:15.5px;margin:0 0 26px;max-width:36ch}
.ob .bigin{width:100%;border:0;border-bottom:2px solid var(--stroke-2);background:transparent;font-family:var(--display);font-size:36px;font-weight:600;letter-spacing:-.035em;padding:8px 0;outline:none;transition:border-color .3s,box-shadow .3s}
.ob .bigin:focus{border-color:var(--mint);box-shadow:0 12px 20px -16px var(--mint-glow)}
.ob .bigin::placeholder{color:var(--ink-4)}
.ob .bigmoney{display:flex;align-items:baseline;gap:8px}
.ob .bigmoney span{font-family:var(--display);font-size:28px;font-weight:500;color:var(--ink-3)}
.ob-foot{display:grid;gap:10px;position:sticky;bottom:0;z-index:3;padding-top:14px;margin-top:-6px;background:linear-gradient(to top,var(--bg) 72%,rgba(27,23,18,0))}
.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daygrid button{aspect-ratio:1;max-width:100%;border-radius:13px;background:var(--glass);border:1px solid var(--stroke);font-weight:600;font-size:14px;color:var(--ink-2);transition:all .35s var(--spring)}
.daygrid button.on{background:var(--mint);border-color:var(--mint);color:var(--accent-ink);transform:scale(1.08);box-shadow:0 0 18px -4px var(--mint-glow)}
.welcome{flex:1;display:flex;flex-direction:column;justify-content:center}
.orb{width:108px;height:108px;border-radius:34px;position:relative;margin-bottom:32px;display:grid;place-items:center;animation:pop 1s var(--spring) both;isolation:isolate}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
.orb::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;background:conic-gradient(from var(--a),var(--mint),var(--gold),#6FA8FF,var(--mint));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:turn 5s linear infinite;z-index:1}
@keyframes turn{to{--a:360deg}}
.orb::after{content:"";position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(closest-side,rgba(214,194,154,.35),transparent);z-index:-1;animation:breathe 4s ease-in-out infinite}
.orb span{width:100%;height:100%;border-radius:inherit;display:grid;place-items:center;background:linear-gradient(145deg,#2A2620,#4A4236);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.orb svg{width:46px;height:46px;color:#F3EFE7;filter:drop-shadow(0 0 10px rgba(214,194,154,.8))}
@keyframes pop{from{opacity:0;transform:scale(.5) rotate(-20deg)}to{opacity:1;transform:none}}
@keyframes breathe{50%{transform:scale(1.15);opacity:.7}}
.welcome h2{font-size:34px}
.welcome .feat{display:grid;gap:12px;margin:6px 0 0}
.welcome .feat div{display:flex;gap:12px;align-items:center;font-size:14.5px;color:var(--ink-2)}
.welcome .feat i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--stroke);color:var(--mint);flex:none}
.welcome .feat svg{width:18px;height:18px}
.result-card{border-radius:var(--r-xl);padding:22px;color:#F3EFE7;background:linear-gradient(145deg,#2A2620,#2E2A24 50%,#4A4236);position:relative;overflow:hidden;isolation:isolate;box-shadow:0 30px 60px -28px rgba(191,168,120,.6),0 0 0 1px rgba(255,255,255,.1) inset;animation:flip 1s var(--spring) both .1s;transform-origin:50% 100%}
.result-card .holo{position:absolute;inset:-60%;z-index:-1;background:conic-gradient(from 0deg,transparent 0 20%,rgba(214,194,154,.16) 30%,rgba(230,207,156,.12) 38%,transparent 50% 100%);animation:spin 14s linear infinite}
@keyframes flip{from{opacity:0;transform:perspective(900px) rotateX(-60deg) translateY(30px)}to{opacity:1;transform:none}}
.result-card .label{color:rgba(243,239,231,.62)}
.result-card .big{transform:none;margin:10px 0 18px}
.result-card .ln{display:flex;justify-content:space-between;font-size:14px;color:rgba(243,239,231,.7);padding:8px 0;border-top:1px solid rgba(255,255,255,.12)}
.result-card .ln b{color:#fff;font-weight:600}
.warnbox{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(229,128,111,.12);border:1px solid rgba(229,128,111,.3);color:#E9A396;font-size:13.5px;font-weight:550}
.splash{position:fixed;inset:0;z-index:70;display:grid;place-items:center}
.splash .orb{margin:0}
.big.neg{color:#E9A396}
.streak{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 11px 5px 8px;border-radius:99px;background:rgba(229,128,111,.12);border:1px solid rgba(229,128,111,.32);color:#D9B98A;font-size:12.5px;font-weight:650}

.zero{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:var(--r-md);border:1px dashed rgba(214,194,154,.4);background:rgba(214,194,154,.05);color:var(--mint);font-weight:650;font-size:14.5px}
.zero svg{width:18px;height:18px}
.recap{display:grid;gap:12px}
.recap .v.pos{color:var(--mint)}.recap .v.neg{color:var(--warn)}
.recap p{margin:0;font-size:14px;color:var(--ink-2)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn.sm{height:44px;width:auto;padding:0 16px;font-size:14px;border-radius:14px}
.tipcard{display:flex;gap:12px;align-items:flex-start}
.tipcard p{margin:0;font-size:13.5px;color:var(--ink-2);flex:1}.tipcard b{color:var(--ink)}
.tipcard .ic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(214,194,154,.12);color:var(--mint)}
.tipcard .ic svg,.goalmini .ic svg{width:19px;height:19px}
.goalmini{display:grid;gap:10px;cursor:pointer}
.typeseg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);padding:3px;border-radius:14px;margin:8px 0 0}
.typeseg button{padding:8px 0;border-radius:11px;font-size:13.5px;font-weight:650;color:var(--ink-3);transition:all .3s var(--spring)}
.typeseg button.on{background:rgba(255,255,255,.09);color:var(--ink);box-shadow:inset 0 0 0 1px var(--stroke-2)}
.typeseg button.on.in{background:rgba(214,194,154,.14);color:var(--mint);box-shadow:inset 0 0 0 1px rgba(214,194,154,.3)}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 8px}
.cat{display:grid;justify-items:center;gap:4px;padding:8px 2px 7px;border-radius:14px;background:var(--glass);border:1px solid var(--stroke);font-size:12px;font-weight:600;color:var(--ink-2);transition:all .3s var(--spring);min-width:0}
